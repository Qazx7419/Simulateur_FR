  wakelock_plus: ^1.2.8
  window_manager: ^0.5.2
  sherpa_onnx: 1.13.3
  archive: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
